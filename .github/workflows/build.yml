name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: LAYERBAR_APP_DIR="$GITHUB_WORKSPACE/dist" ./make-app.sh

      - name: Zip app bundle
        run: ditto -c -k --keepParent dist/LayerBar.app dist/LayerBar.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LayerBar
          path: dist/LayerBar.app.zip
