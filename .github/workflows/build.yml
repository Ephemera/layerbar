name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: LAYERBAR_APP_DIR="$GITHUB_WORKSPACE/dist" ./make-app.sh

      - name: Zip app bundle
        run: ditto -c -k --keepParent dist/LayerBar.app dist/LayerBar.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LayerBar
          path: dist/LayerBar.app.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LayerBar.app.zip
          generate_release_notes: true
